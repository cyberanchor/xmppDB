{{- /* One line on every page: copyright, data sources, Hugo, author. */ -}}
<footer class="xdb-footer">
  <span>&copy; {{ now.Year }} <a href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a></span>
  <span aria-hidden="true">·</span>
  <span>Provider details: <a href="https://providers.xmpp.net/" rel="noopener">XMPP Providers</a> (CC0)</span>
  <span aria-hidden="true">·</span>
  <span>Built with <a href="https://gohugo.io/" rel="noopener">Hugo</a></span>
  {{- with site.Params.author }}
  <span aria-hidden="true">·</span>
  <a href="{{ .url }}" rel="noopener author">{{ .name }}</a>
  {{- end }}
</footer>
