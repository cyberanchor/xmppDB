{{- /* Top bar: the mark and name link home; links to the downloads and the repository; light / dark switch. */ -}}
{{- $mark := (resources.Get "xdb/mark.png").Process "resize 64x64 png" -}}
<header class="xdb-bar">
  <a class="xdb-brand" href="{{ site.Home.RelPermalink }}">
    <img src="{{ $mark.RelPermalink }}" width="28" height="28" alt="">
    <span>xmpp<b>DB</b></span>
  </a>
  <nav class="xdb-nav" aria-label="Site">
    <a href="{{ site.Home.RelPermalink }}#servers">Servers</a>
    <a href="{{ "servers.csv" | relURL }}" download>CSV</a>
    <a href="{{ "servers.json" | relURL }}" download>JSON</a>
    <a href="{{ site.Params.repo }}" rel="noopener">GitHub</a>
    <button type="button" class="xdb-theme" data-xdb-theme title="Light / dark" aria-label="Switch between light and dark theme">
      <svg class="xdb-theme-dark" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="xdb-theme-light" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2.5M12 20v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M1.5 12H4M20 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>
    </button>
  </nav>
</header>
